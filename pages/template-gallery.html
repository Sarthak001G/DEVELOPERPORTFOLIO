        <!-- Populated by JS -->
      </div>

      <!-- Preview Modal -->
      <div class="modal-backdrop" id="preview-modal">
        <div class="modal" style="max-width:900px;width:95%;max-height:90vh">

            <h3 class="modal-title" id="preview-modal-title">Template Preview</h3>

            </button>
          </div>
          <div class="modal-body" style="padding:0;height:500px">
            <iframe id="preview-iframe" style="width:100%;height:100%;border:none;border-radius:0 0 var(--radius-xl) var(--radius-xl)"></iframe>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" id="preview-modal-close2">Cancel</button>
            <button class="btn btn-primary" id="preview-modal-select">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14"><polyline points="20 6 9 17 4 12"/></svg>

            </button>
          </div>
        </div>
      </div>

    </div>

<div id="toast-container" class="toast-container"></div>

<style>
.tg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-6); }

.tg-card {
  background: var(--gradient-card);
  border: 2px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  overflow: hidden;
  cursor: pointer;
  transition: border-color var(--transition-normal), box-shadow var(--transition-normal), transform var(--transition-normal);
}
.tg-card:hover { border-color: var(--accent-blue); box-shadow: var(--shadow-glow); transform: translateY(-4px); }
.tg-card.active { border-color: var(--accent-violet); box-shadow: 0 0 30px rgba(139,92,246,0.3); }

.tg-preview {
  height: 220px;
  overflow: hidden;
  position: relative;
  background: var(--bg-surface);
}
.tg-preview iframe {
  width: 200%; height: 200%;
  transform: scale(0.5) translate(-50%, -50%);
  pointer-events: none;
  border: none;
}
.tg-preview-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.4);
  opacity: 0;
  transition: opacity var(--transition-fast);
}
.tg-card:hover .tg-preview-overlay { opacity: 1; }

.tg-body { padding: var(--space-5); }
.tg-name { font-size: var(--text-md); font-weight: var(--font-bold); color: var(--text-primary); margin-bottom: var(--space-1); }
.tg-desc { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-4); }
.tg-footer { display: flex; align-items: center; justify-content: space-between; }
.tg-active-badge { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); font-weight: var(--font-semibold); color: var(--accent-violet); }
.tg-active-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-violet); box-shadow: 0 0 8px var(--accent-violet); }
</style>
